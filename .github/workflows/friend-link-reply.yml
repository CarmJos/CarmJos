name: Friend Link Config Generator

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'friend-link')
    steps:
      - name: Parse and reply
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body;
            const githubId = issue.user.login;

            // Parse form fields
            function getField(label) {
              const regex = new RegExp(`### ${label}\\n\\n([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const name = getField('名字');
            const nickname = getField('昵称');
            const avatarInput = getField('头像链接');
            const description = getField('个人简介');

            // Parse links
            const links = [];
            for (let i = 1; i <= 3; i++) {
              const url = getField(`链接${i} - URL`);
              const label = getField(`链接${i} - Label`);
              const icon = getField(`链接${i} - Icon`) || 'fas fa-blog';

              if (url && label) {
                links.push({ icon, url, label });
              }
            }

            // Build avatar
            const avatar = avatarInput || `https://github.com/${githubId}.png`;

            // Build YAML output
            let yaml = `\`\`\`yaml\n${githubId}:\n  name: ${name}`;

            if (nickname) {
              yaml += `\n  nickname: ${nickname}`;
            }

            yaml += `\n  avatar:\n    url: ${avatar}`;
            yaml += `\n  description: ${description}`;
            yaml += `\n  links:`;

            for (const link of links) {
              yaml += `\n    - icon: ${link.icon}`;
              yaml += `\n      url: ${link.url}`;
              yaml += `\n      label: ${link.label}`;
            }

            yaml += '\n\`\`\`';

            // Create comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `感谢你的友链申请！以下是你的友链信息：\n\n${yaml}\n\n请确认信息无误后，我会尽快添加到网站上。`
            });
