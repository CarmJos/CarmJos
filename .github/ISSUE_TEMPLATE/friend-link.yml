name: 友链申请
description: 申请添加友链到我的个人网站
title: "feat(social): 添加友链"
labels: ["友链申请"]
assignees:
  - carmjos
body:
  - type: markdown
    attributes:
      value: |
        ## 友链申请

        感谢您跟我交换友链！您可以填写此模板以提交您的信息，同时我的友链信息如下所示：

        ```yaml
        CarmJos:
          name: CarmJos
          nickname: 卡姆
          avatar:
            url: https://github.com/CarmJos.png
          description: 热爱生活中的点滴美好，追寻万物中的无尽创造。
          links:
            - icon: fab fa-github
              url: https://github.com/CarmJos
              label: GitHub
            - icon: fas fa-blog
              url: https://www.carm.cc/
              label: Blog
        ```

        如果您希望互为友链，至少需要满足以下要求：
        - 您与我在线上 / 线下相识，并在至少一个社交平台互为好友；
        - 您的博客或网站正在正常运行，并且在可预见的未来也将继续运行下去；
        - 您的博客或网站必须使用 SSL/TLS 加密，并最好开启了 HSTS。

        请填写以下信息，提交后我会自动回复您格式化的友链数据。

  - type: markdown
    attributes:
      value: |
        ## 基本信息

  - type: input
    id: name
    attributes:
      label: 名字 (ID)
      description: 您的显示名称 (一般为英文名)
      placeholder: "CarmJos"
    validations:
      required: true

  - type: input
    id: nickname
    attributes:
      label: 昵称
      description: 可选，您的昵称（一般为中文）
      placeholder: "卡姆"
    validations:
      required: false

  - type: input
    id: avatar
    attributes:
      label: 头像链接
      description: "可选，默认采用 GitHub 头像 (`https://github.com/<ID>.png`)"
      placeholder: "https://github.com/CarmJos.png"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 个人简介
      description: 一句话介绍自己（100字以内）
      placeholder: "热爱生活中的点滴美好，追寻万物中的无尽创造。"
    validations:
      required: true
      maxlength: 100

  - type: markdown
    attributes:
      value: |
        ## 链接信息

        请填写至少一个链接，每个链接需要包含 URL 和 Label。
        Icon 可从 [Font Awesome](https://fontawesome.com/) 自选免费内容，默认为 `fas fa-blog`。

  - type: input
    id: link1_url
    attributes:
      label: "链接1 - URL"
      description: 链接地址
      placeholder: "https://github.com/CarmJos"
    validations:
      required: true

  - type: input
    id: link1_label
    attributes:
      label: "链接1 - Label"
      description: 链接显示名称
      placeholder: "GitHub"
    validations:
      required: true

  - type: input
    id: link1_icon
    attributes:
      label: "链接1 - Icon"
      description: "Font Awesome 图标类名，默认为 fas fa-blog"
      placeholder: "fab fa-github"
    validations:
      required: false

  - type: input
    id: link2_url
    attributes:
      label: "链接2 - URL"
      description: 链接地址（可选）
      placeholder: "https://www.carm.cc/"
    validations:
      required: false

  - type: input
    id: link2_label
    attributes:
      label: "链接2 - Label"
      description: 链接显示名称
      placeholder: "Blog"
    validations:
      required: false

  - type: input
    id: link2_icon
    attributes:
      label: "链接2 - Icon"
      description: "Font Awesome 图标类名，默认为 fas fa-blog"
      placeholder: "fas fa-blog"
    validations:
      required: false

  - type: input
    id: link3_url
    attributes:
      label: "链接3 - URL"
      description: 链接地址（可选）
      placeholder: "https://space.bilibili.com/123456"
    validations:
      required: false

  - type: input
    id: link3_label
    attributes:
      label: "链接3 - Label"
      description: 链接显示名称
      placeholder: "BiliBili"
    validations:
      required: false

  - type: input
    id: link3_icon
    attributes:
      label: "链接3 - Icon"
      description: "Font Awesome 图标类名，默认为 fas fa-blog"
      placeholder: "fa-brands fa-bilibili"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 请确认以下事项
      options:
        - label: 我同意遵守 Carm's Home 的友链规范和要求
          required: true
        - label: 我已添加 Carm's Home 的友链到我的个人网站（如果有）
          required: true
        - label: 我已确认我的头像链接正确（如果未提供，将使用 GitHub 头像）
          required: true
        - label: 我已确认我的链接信息正确且至少包含一个有效链接
          required: true
